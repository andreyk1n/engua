<script>
  /* =========================================================
     js/components/header.js — лише хедер: burger, search, theme
  ========================================================= */
  (function () {
    var burger = document.querySelector('[data-burger]');
    var mobileMenu = document.querySelector('[data-mobile-menu]');

    function closeMenu() {
      burger.classList.remove('header__burger--open');
      mobileMenu.classList.remove('header__mobile-menu--open');
      burger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }
    burger.addEventListener('click', function () {
      var isOpen = mobileMenu.classList.toggle('header__mobile-menu--open');
      burger.classList.toggle('header__burger--open', isOpen);
      burger.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    mobileMenu.querySelectorAll('.header__mobile-link').forEach(function (link) {
      link.addEventListener('click', closeMenu);
    });

    var searchWrap = document.querySelector('[data-search]');
    var searchToggle = document.querySelector('[data-search-toggle]');
    searchToggle.addEventListener('click', function () {
      var isOpen = searchWrap.classList.toggle('header__search--open');
      searchToggle.setAttribute('aria-expanded', String(isOpen));
      if (isOpen) { searchWrap.querySelector('input').focus(); }
    });
    document.addEventListener('click', function (e) {
      if (!searchWrap.contains(e.target)) {
        searchWrap.classList.remove('header__search--open');
        searchToggle.setAttribute('aria-expanded', 'false');
      }
    });

    var themeToggle = document.querySelector('[data-theme-toggle]');
    var body = document.body;
    var saved = null;
    try { saved = window.localStorage.getItem('engua-theme'); } catch (e) { }
    if (saved) { body.setAttribute('data-theme', saved); }
    themeToggle.addEventListener('click', function () {
      var next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      body.setAttribute('data-theme', next);
      try { window.localStorage.setItem('engua-theme', next); } catch (e) { }
    });
  })();
</script>

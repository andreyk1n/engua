@@include('partials/head.html')

<div class="wrapper">
  @@include('partials/header.html')

  <main class="main">

    @@include('components/test.html')

  </main>

</div>

<script>
(function(){
  var showBtn = document.querySelector('[data-show-answers]');
  var key = document.querySelector('[data-answer-key]');
  showBtn.addEventListener('click', function(){
    var isVisible = key.classList.toggle('worksheet-key--visible');
    showBtn.textContent = isVisible ? 'Сховати відповіді' : 'Показати відповіді';
    if(isVisible){ key.scrollIntoView({ behavior:'smooth', block:'start' }); }
  });

  var printBtn = document.querySelector('[data-print-btn]');
  if(printBtn){ printBtn.addEventListener('click', function(){ window.print(); }); }
})();
</script>

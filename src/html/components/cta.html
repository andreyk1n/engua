<section class="cta">
    <div class="container">
        <div class="cta__inner">
            <div>
                <h2 class="cta__title">@@title</h2>
                <p class="cta__text">@@text</p>
            </div>
            <div class="cta__actions">
                <a href="@@primaryButtonUrl" class="btn btn--primary">
                    @@primaryButton
                </a>
                <a href="@@secondaryButtonUrl" class="btn btn--ghost">
                    @@secondaryButton
                </a>
            </div>
        </div>
    </div>
</section>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGUA — Learn English. Practice. Improve. Master.</title>
<meta name="description" content="ENGUA — інтерактивна платформа для самостійного вивчення англійської: граматика, лексика, читання, аудіювання, тести та прогрес.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>



/* =========================================================
   components/_button.scss
========================================================= */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px 26px;
  border-radius:999px;
  font-weight:600;
  font-size:15px;
  border:1.5px solid transparent;
  transition:transform var(--transition), background var(--transition), color var(--transition), border-color var(--transition);
  white-space:nowrap;
}
.btn:active{ transform:translateY(1px); }
.btn--primary{
  background:var(--ink);
  color:var(--paper);
}
[data-theme="dark"] .btn--primary{ background:var(--accent); color:#0d1614; }
.btn--primary:hover{ background:var(--accent-dark); color:#fff; }
.btn--ghost{
  background:transparent;
  border-color:var(--border);
  color:var(--ink);
}
.btn--ghost:hover{ border-color:var(--ink); }
.btn--small{ padding:10px 18px; font-size:13px; }

/* =========================================================
   layout/_header.scss
========================================================= */


/* =========================================================
   sections/_hero.scss
========================================================= */


/* =========================================================
   sections/_dashboard.scss
========================================================= */


/* =========================================================
   sections/_features.scss (site map / "what's inside")
========================================================= */

/* =========================================================
   sections/_cta-banner.scss
========================================================= */
.cta-banner{ padding:0 0 90px; }
.cta-banner__inner{
  background:var(--ink);
  color:var(--paper);
  border-radius:var(--radius-l);
  padding:56px 48px;
  display:flex; align-items:center; justify-content:space-between; gap:32px;
  flex-wrap:wrap;
  position:relative;
  overflow:hidden;
}
[data-theme="dark"] .cta-banner__inner{ background:var(--surface); border:1px solid var(--border); }
.cta-banner__inner::after{
  content:"";
  position:absolute; right:-40px; top:-40px; width:180px; height:180px;
  background:var(--accent-warm); opacity:.16; border-radius:50%;
}
.cta-banner__title{ font-size:clamp(1.6rem,3vw,2.1rem); max-width:420px; }
.cta-banner__text{ color:#c7d3ce; margin-top:10px; max-width:380px; font-size:14.5px; }
[data-theme="dark"] .cta-banner__text{ color:var(--ink-soft); }
.cta-banner__actions{ display:flex; gap:14px; flex-wrap:wrap; position:relative; z-index:1; }
.cta-banner .btn--primary{ background:var(--accent-warm); color:#402c07; }
.cta-banner .btn--primary:hover{ background:#f0bb5a; }
.cta-banner .btn--ghost{ border-color:#3a4a46; color:var(--paper); }
[data-theme="dark"] .cta-banner .btn--ghost{ border-color:var(--border); color:var(--ink); }

@media (max-width:575px){
  .cta-banner__inner{ padding:38px 26px; }
  .cta-banner__actions .btn{ flex:1 1 auto; text-align:center; }
}

/* =========================================================
   layout/_footer.scss
========================================================= */


</style>
</head>

<main>

  ========================================================= -->

       VALUES
  ========================================================= -->


  <!-- =========================================================
       CTA BANNER
  ========================================================= -->
  <section class="cta-banner">
    <div class="container">
      <div class="cta-banner__inner">
        <div>
          <h2 class="cta-banner__title">Ready to open your first page?</h2>
          <p class="cta-banner__text">Почніть із безкоштовної вправи або пройдіть тест, щоб дізнатися свій рівень.</p>
        </div>
        <div class="cta-banner__actions">
          <a href="/exercises" class="btn btn--primary">Start Learning</a>
          <a href="/tests" class="btn btn--ghost">Take a Test</a>
        </div>
      </div>
    </div>
  </section>

</main>

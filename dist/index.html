    <a href="/" class="header__logo">

      <div class="header__search" data-search>
        <button type="button" class="header__search-toggle" data-search-toggle aria-expanded="false" aria-label="Відкрити пошук">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

          <input id="header-search-input" class="header__search-input" type="text" placeholder="present perfect...">
          <button type="submit" class="header__search-submit" aria-label="Шукати">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
